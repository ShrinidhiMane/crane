# Every 2 minutes: retry jobs whose worker vanished, delete old finished jobs,
# and forget workers that are long gone. Workers also retry lost jobs
# themselves, so this is the safety net for when no worker is running.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crane-janitor
  namespace: crane
  labels:
    app.kubernetes.io/name: crane
    app.kubernetes.io/component: janitor
    app.kubernetes.io/part-of: crane
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid  # never run two janitors at once
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/name: crane
            app.kubernetes.io/component: janitor
            app.kubernetes.io/part-of: crane
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: janitor
              image: crane:1.0
              imagePullPolicy: IfNotPresent
              args: ["janitor"]
              envFrom:
                - configMapRef: {name: crane-config}
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: crane-redis, key: password}
                - name: POD_NAME
                  valueFrom:
                    fieldRef: {fieldPath: metadata.name}
              resources:
                requests: {cpu: 20m, memory: 48Mi}
                limits: {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
