# The API and dashboard: 2 replicas behind a LoadBalancer. Each pod puts its own
# name on every response, so the dashboard shows which replica answered.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crane-api
  namespace: crane
  labels:
    app.kubernetes.io/name: crane
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: crane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: crane
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # during an update, never drop below 2 ready API pods
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crane
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: crane
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: crane:1.0
          imagePullPolicy: IfNotPresent  # built inside minikube, never pulled
          args: ["api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: crane-config}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: crane-redis, key: password}
            - name: POD_NAME  # Downward API: the pod learns its own name...
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: NODE_NAME  # ...and which node it landed on
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 192Mi}
          # Readiness pings Redis: no Redis, no traffic to this pod.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          # Liveness only checks the process. If it pinged Redis too, a Redis
          # restart would make Kubernetes restart every healthy API pod.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: crane-api
  namespace: crane
  labels:
    app.kubernetes.io/name: crane
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: crane
spec:
  type: LoadBalancer  # on minikube: `minikube tunnel` gives it an external IP
  selector:
    app.kubernetes.io/name: crane
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Voluntary disruptions (like draining a node) may never take the last API pod.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: crane-api
  namespace: crane
  labels:
    app.kubernetes.io/part-of: crane
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crane
      app.kubernetes.io/component: api
