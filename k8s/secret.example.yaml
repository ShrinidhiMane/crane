# Example only: real passwords never go in Git.
#
# scripts/up.sh creates this Secret with a random password:
#   kubectl -n crane create secret generic crane-redis --from-literal=password=<random>
#
# To use a file instead, copy this to k8s/secret.yaml (it's in .gitignore),
# change the value, and run: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: crane-redis
  namespace: crane
  labels:
    app.kubernetes.io/part-of: crane
type: Opaque
stringData:
  password: change-me
