name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 k8s/
      - name: Lint scripts
        run: shellcheck -x scripts/*.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crane:ci .
      - name: Smoke test the image
        run: |
          docker network create crane
          docker run -d --name redis --network crane redis:7-alpine redis-server --requirepass ci
          docker run -d --name api --network crane -p 8080:8080 -e REDIS_HOST=redis -e REDIS_PASSWORD=ci --read-only --tmpfs /tmp crane:ci api
          docker run -d --name worker --network crane -e REDIS_HOST=redis -e REDIS_PASSWORD=ci --read-only --tmpfs /tmp crane:ci worker
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          curl -sf -X POST localhost:8080/api/jobs -H 'content-type: application/json' -d '{"kind":"primes","n":100000,"count":5}'
          for i in $(seq 1 30); do
            done=$(curl -s localhost:8080/api/stats | python3 -c 'import json,sys; print(json.load(sys.stdin)["done"])')
            [ "$done" = "5" ] && echo "all 5 jobs done" && exit 0
            sleep 1
          done
          docker logs worker; exit 1
